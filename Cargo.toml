[package]
name = "yatori-unipus"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"

[lib]
name = "yatori_unipus"
path = "src/lib.rs"

[features]
default = []
whisper = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hound", "dep:flate2", "dep:ureq"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "deflate", "http2"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
base64 = "0.23.1"
aes = "0.9.3"
hex = "0.4.3"
rand = "0.10.3"
sha1 = "0.11.0"
log = "0.4.34"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
hound = { version = "3.5.1", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
ureq = { version = "3.5.0", optional = true }
tokio-util = { version = "0.7.20", features = ["rt"] }
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
cbc = { version = "0.2.1", features = ["alloc"] }
hmac = "0.13.0"
sha2 = "0.11.1"
